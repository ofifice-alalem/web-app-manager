<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة شاشة الانتظار - Taqniya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        @keyframes steam {
            0% { transform: translateX(180%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(-180%); }
        }
        .animate-progress-smooth {
            animation: steam 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        /* Seamless mix-blend mode on light mode */
        html:not(.dark) .blend-clean {
            mix-blend-mode: multiply;
        }
        html.dark .blend-clean {
            mix-blend-mode: screen;
            filter: brightness(1.05) contrast(1.1);
        }

        /* Professional Theme Switcher */
        .theme-switch-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 3px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#12161c] text-slate-800 dark:text-slate-100 min-h-screen w-full flex flex-col items-center justify-center p-6 select-none overflow-hidden relative">

    <!-- Top Floating Switcher Bar (Light / Dark Mode & Navigation) -->
    <div class="fixed top-4 left-6 right-6 flex items-center justify-between z-50">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-[#1c2430] hover:bg-slate-200 dark:hover:bg-[#263242] text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 transition">
                <span>← بوابة المعاينات</span>
            </a>
            <span class="text-xs font-mono text-slate-400 dark:text-slate-500 hidden sm:inline">OVERLAY // PREVIEW</span>
        </div>

        <!-- High-End Theme Toggle Segmented Control -->
        <div class="flex items-center gap-1 p-1 bg-slate-100 dark:bg-[#1c2430] border border-slate-300 dark:border-slate-700 rounded-full shadow-sm">
            <button id="btnLight" onclick="setTheme(false)" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span>فاتح</span>
            </button>
            <button id="btnDark" onclick="setTheme(true)" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span>داكن</span>
            </button>
        </div>
    </div>

    <!-- Full Screen Two-Column Layout -->
    <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center mt-6">
        
        <!-- Right Column: Text & Progress (5 Columns) -->
        <div class="lg:col-span-5 space-y-7 text-right order-2 lg:order-1">
            
            <!-- Modern Tech Pill -->
            <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-blue-50/90 dark:bg-sky-950/40 border border-blue-200/60 dark:border-sky-800/50 text-[#1e40af] dark:text-[#38bdf8] text-xs font-black shadow-sm">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#1d4ed8] dark:bg-sky-400"></span>
                </span>
                <span>فحص ومزامنة الاتصال المحلي...</span>
            </div>

            <!-- Main Heading -->
            <div class="space-y-3">
                <h1 class="text-5xl lg:text-6xl font-black text-slate-900 dark:text-white tracking-tight leading-tight">
                    <span class="text-[#1d4ed8] dark:text-[#38bdf8]">لحظة!</span>
                    جـارٍ تجهيز المنظومة
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-lg lg:text-xl font-medium leading-relaxed max-w-xl">
                    نقوم الآن بالتحقق من استجابة قاعدة البيانات ومحرك الخدمات محلياً، وسيتم تحويلك لواجهة البيع فور اكتمال الجاهزية.
                </p>
            </div>

            <!-- Progress Bar Section -->
            <div class="pt-4 space-y-3 max-w-lg">
                <div class="flex justify-between items-center text-xs font-bold text-slate-400 dark:text-slate-400 px-1">
                    <span>استعادة الخدمة وإعادة التحميل الذاتي</span>
                    <span class="font-mono text-[#1d4ed8] dark:text-[#38bdf8] font-black">الخطوة 1 من 2</span>
                </div>
                
                <div class="h-3.5 w-full bg-slate-100 dark:bg-[#1a2330] rounded-full overflow-hidden shadow-inner p-0.5 border border-slate-200/50 dark:border-slate-700/60">
                    <div class="h-full w-2/5 bg-gradient-to-l from-[#1d4ed8] via-[#0284c7] to-[#38bdf8] rounded-full animate-progress-smooth"></div>
                </div>
            </div>

        </div>

        <!-- Left Column: EXTRA LARGE (7 Columns) - No Shadow, Pure Background Blend -->
        <div class="lg:col-span-7 relative flex items-center justify-center order-1 lg:order-2 bg-transparent">
            
            <!-- Large Frame with Shared Asset Image -->
            <div class="relative w-[520px] h-[520px] sm:w-[640px] sm:h-[640px] flex items-center justify-center bg-transparent">
                <img 
                    src="../assets/img/recovery-illustration.jpg" 
                    alt="Taqniya System Recovery" 
                    class="w-full h-full object-contain blend-clean select-none pointer-events-none drop-shadow-none"
                />
            </div>

        </div>

    </div>

    <!-- Theme Controller Script -->
    <script>
        function setTheme(isDark) {
            const html = document.documentElement;
            const btnLight = document.getElementById('btnLight');
            const btnDark = document.getElementById('btnDark');

            if (isDark) {
                html.classList.add('dark');
                btnDark.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition bg-[#2e3c4d] text-[#66c0f4] shadow-sm';
                btnLight.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition text-slate-400 hover:text-white';
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark');
                btnLight.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition bg-white text-amber-600 shadow-sm';
                btnDark.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition text-slate-500 hover:text-slate-900';
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme === 'dark');
    </script>
</body>
</html>
