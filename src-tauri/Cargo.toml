[package]
name = "desktop-application-host"
version = "0.1.0"
description = "Single-application desktop host built with Tauri 2."
authors = ["Desktop Host Team"]
edition = "2021"

[lib]
name = "desktop_application_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
