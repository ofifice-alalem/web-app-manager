[package]
name = "desktop-host-settings"
version = "0.1.0"
description = "Configuration and diagnostics companion app for Desktop Application Host."
authors = ["Desktop Host Team"]
edition = "2021"

[lib]
name = "desktop_host_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
